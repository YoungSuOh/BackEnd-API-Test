spring:
  datasource:
    url: jdbc:h2:mem:order_db;MODE=MySQL;NON_KEYWORDS=ORDER,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
